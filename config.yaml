# Lecture Transcriber — configuration
# This is the only file you should need to edit.

# Paths (relative to this config file's directory)
input_dir: input
output_dir: output
models_dir: models

# STT (whisper.cpp)
stt:
  whisper_binary: whisper-cli
  # https://huggingface.co/ggerganov/whisper.cpp/resolve/main/<filename>
  model_url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
  model_filename: ggml-large-v3-turbo.bin
  # Language spoken in the course (override per run with --language):
  #   zh   = Mandarin course (transcribed in Chinese, then translated to English)
  #   en   = English course (translation step is skipped)
  #   auto = let whisper guess — not recommended: it misdetects Mandarin as English
  language: zh
  sample_rate: 16000

# LLM (Ollama — local daemon at localhost:11434)
llm:
  model: gemma4:31b-mlx
  base_url: http://localhost:11434
  temperature: 0.2
  num_ctx: 16384
  num_predict: 4096
  timeout_seconds: 300

# Chunking
# ~1.5 characters per token (Chinese estimate) → chunks of ~4500 characters,
# split on sentence boundaries.
chunk_tokens: 3000
overlap_sentences: 1

# Options
# Optional noise reduction. Requires the "denoise" poetry group:
#   poetry install --with denoise
enable_denoise: false

# Language the summary is written in (e.g. "English", "Traditional Chinese")
summary_language: English

# Prompts — feel free to tune the wording.
prompts:
  translate: |
    Translate the following lecture transcript into natural, fluent English.
    Be faithful to the meaning; do not add, remove, or explain content.
    Output only the translation, with no preamble or commentary.

  summary_chunk: |
    You are writing detailed study notes for one part of a university lecture.
    Capture every concept explained, with its definitions, examples, formulas
    or steps, and the reasoning behind them. Write short explanatory
    paragraphs; use bullets only for genuine lists. Write in English and
    output only the notes, with no preamble.

  summary_all: |
    The following are study notes for consecutive parts of one lecture,
    separated by "---". Merge them into one comprehensive lecture summary in
    Markdown:
    1. An overview of 2-3 sentences.
    2. One "##" section per topic, in lecture order, written as explanatory
       paragraphs that keep the definitions, examples and reasoning.
    3. A "## Key terms" list with a one-line definition for each term.
    4. A "## Key takeaways" list.
    Remove duplication but do not compress away detail. Output only the
    summary, in English.
